services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tugasweb-api:latest
    container_name: tugasweb-api
    restart: unless-stopped
    ports:
      # Format: "PORT_CASAOS:PORT_CONTAINER"
      # Anda bisa ubah angka 8081 atau set variabel APP_PORT saat deploy di Portainer
      - "${APP_PORT:-8081}:80"
    environment:
      APP_NAME: "TugasWeb API"
      APP_ENV: production
      APP_KEY: "${APP_KEY:-base64:Opx3eDpk4MHR0Bz1bU3rDxuHZRbDja3vta9tscCzIXU=}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8081}"
      ASSET_URL: "${ASSET_URL:-}"
      RUN_MIGRATIONS: "true"
      
      # Database Config (menghubungkan ke service 'db' di bawah)
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-tugasweb_apiuas}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-rootpassword}"
      
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      
      # Firebase Config (OPSIONAL - sesuaikan atau letakkan di rahasia lingkungan)
      FIREBASE_API_KEY: "${FIREBASE_API_KEY:-}"
      FIREBASE_AUTH_DOMAIN: "${FIREBASE_AUTH_DOMAIN:-}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      FIREBASE_STORAGE_BUCKET: "${FIREBASE_STORAGE_BUCKET:-}"
      FIREBASE_MESSAGING_SENDER_ID: "${FIREBASE_MESSAGING_SENDER_ID:-}"
      FIREBASE_APP_ID: "${FIREBASE_APP_ID:-}"
    volumes:
      - tugasweb_storage:/var/www/html/storage/app
      - tugasweb_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tugasweb-network

  db:
    image: mariadb:11.4
    container_name: tugasweb-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-rootpassword}"
      MYSQL_DATABASE: "${DB_DATABASE:-tugasweb_apiuas}"
    volumes:
      - tugasweb_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tugasweb-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: tugasweb-phpmyadmin
    restart: unless-stopped
    ports:
      # Akses phpMyAdmin melalui browser di http://IP_CASAOS:8088
      - "${PMA_PORT:-8088}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "${DB_PASSWORD:-rootpassword}"
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - tugasweb-network

volumes:
  tugasweb_storage:
  tugasweb_logs:
  tugasweb_db_data:

networks:
  tugasweb-network:
    driver: bridge
